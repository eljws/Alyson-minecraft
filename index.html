<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Alyson's World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Layout: full-screen 3D world, chunky pixel UI floating on the edges */
  :root {
    --sky: #8ecff5;
    --panel: rgba(30, 36, 28, 0.62);
    --panel-hi: rgba(30, 36, 28, 0.82);
    --ink: #fffdf3;
    --gold: #ffd84a;
    --edge: #1d2219;
    --pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
    --body: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); }
  [hidden] { display: none !important; }
  body { font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
    display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between;
    pointer-events: none;
  }
  .title {
    font-family: var(--pixel); font-weight: 700; font-size: clamp(16px, 4vw, 24px);
    color: var(--ink); text-shadow: 3px 3px 0 var(--edge); letter-spacing: 0.04em; line-height: 1.1;
    padding-top: 4px;
  }
  .title small { display: block; font-size: 0.5em; font-weight: 400; opacity: 0.9; letter-spacing: 0.08em; text-shadow: 2px 2px 0 var(--edge); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: auto; }
  .btn {
    font: inherit; font-size: 22px; line-height: 1; min-width: 46px; height: 46px; padding: 0 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 2px;
    background: var(--panel); color: var(--ink); border: 3px solid var(--edge); border-radius: 4px;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,0.3), inset 3px 3px 0 rgba(255,255,255,0.18);
    cursor: pointer; touch-action: manipulation;
  }
  .btn:active { transform: translateY(2px); }
  .btn:focus-visible, .slot:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btn .plus { font-family: var(--pixel); font-size: 13px; color: var(--gold); }
  .btn.sep { margin-left: 6px; }
  .btn.warn { font-family: var(--pixel); font-size: 11px; color: var(--gold); }

  #hotbar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 3px; padding: 4px; background: var(--panel-hi); border: 3px solid var(--edge); border-radius: 4px;
    max-width: calc(100vw - 24px);
  }
  .slot {
    --s: clamp(26px, calc((100vw - 70px) / 11), 46px);
    width: var(--s); height: var(--s); padding: 0; border: 3px solid #5b5f55; border-radius: 2px;
    background: #8b8b8b center / 70% no-repeat; image-rendering: pixelated; cursor: pointer;
    font-size: calc(var(--s) * 0.5); display: flex; align-items: center; justify-content: center; touch-action: manipulation;
  }
  .slot.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--edge), 0 0 10px var(--gold); transform: translateY(-3px); }
  #label {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    font-family: var(--pixel); font-size: 14px; color: var(--ink); text-shadow: 2px 2px 0 var(--edge);
    white-space: nowrap; pointer-events: none; transition: opacity .4s;
  }
  #hint {
    position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font-size: 12px; line-height: 1.5; max-width: 220px; padding: 8px 10px; background: var(--panel); border-radius: 4px;
    pointer-events: none;
  }
  #hint b { color: var(--gold); font-weight: 600; }

  #stick, #jump { display: none; }
  @media (pointer: coarse) {
    #hint { display: none; }
    #stick {
      display: block; position: fixed; width: 120px; height: 120px; border-radius: 50%;
      left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      background: rgba(30,36,28,0.35); border: 3px solid rgba(255,253,243,0.5); touch-action: none;
    }
    #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
      background: rgba(255,253,243,0.85); border: 3px solid var(--edge); }
    #jump {
      display: flex; position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      width: 84px; height: 84px; border-radius: 50%; font-family: var(--pixel); font-size: 15px;
      align-items: center; justify-content: center;
      background: rgba(30,36,28,0.45); color: var(--ink); border: 3px solid rgba(255,253,243,0.6); touch-action: none;
    }
  }
  @media (max-width: 520px) {
    .btn { min-width: 40px; height: 40px; font-size: 19px; }
    #top { flex-direction: column; }
    .btns { justify-content: flex-start; }
  }
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(29, 34, 25, 0.45); touch-action: auto;
  }
  #start .card {
    width: min(420px, 100%); display: grid; gap: 12px; padding: 20px;
    background: var(--panel-hi); border: 3px solid var(--edge); border-radius: 4px;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,0.3), inset 4px 4px 0 rgba(255,255,255,0.12);
  }
  #start h1 { margin: 0 0 4px; font-family: var(--pixel); font-size: clamp(22px, 6vw, 30px); text-shadow: 3px 3px 0 var(--edge); text-wrap: balance; }
  #start label, #start .lbl { font-family: var(--pixel); font-size: 13px; letter-spacing: 0.06em; color: var(--gold); }
  #start .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #name-in {
    flex: 1; min-width: 0; height: 46px; padding: 0 12px; font: 600 18px var(--body);
    color: var(--edge); background: var(--ink); border: 3px solid var(--edge); border-radius: 2px; user-select: text; -webkit-user-select: text;
  }
  #name-in:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  .look { width: 56px; height: 56px; border: 3px solid var(--edge); border-radius: 2px; cursor: pointer; padding: 0; }
  .look.sel { outline: 3px solid var(--gold); outline-offset: 2px; }
  .look:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .play {
    height: 56px; margin-top: 4px; font-family: var(--pixel); font-weight: 700; font-size: 22px; letter-spacing: 0.1em;
    color: var(--edge); background: var(--gold); border: 3px solid var(--edge); border-radius: 2px; cursor: pointer;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,0.2), inset 4px 4px 0 rgba(255,255,255,0.4);
  }
  .play:active { transform: translateY(2px); }
  .play:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #errbox {
    position: fixed; z-index: 40; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: min(560px, calc(100vw - 32px)); padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
    font: 13px/1.45 ui-monospace, "Courier New", monospace; color: #fffdf3; background: #8a2330; border: 3px solid var(--edge); border-radius: 4px;
    user-select: text; -webkit-user-select: text;
  }
  #oops { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: var(--pixel); text-align: center; color: var(--edge); background: var(--sky); }
</style>

<canvas id="game" aria-label="Alyson's World game view"></canvas>

<div id="top">
  <div class="title">Alyson's World<small id="sub">dig, build &amp; pet the animals</small></div>
  <div class="btns">
    <button class="btn" data-spawn="pig" title="Add a pig" aria-label="Add a pig">🐷<span class="plus">+</span></button>
    <button class="btn" data-spawn="cow" title="Add a cow" aria-label="Add a cow">🐮<span class="plus">+</span></button>
    <button class="btn" data-spawn="person" title="Add a person" aria-label="Add a person">🧑<span class="plus">+</span></button>
    <button class="btn" data-spawn="duck" title="Add a baby duck" aria-label="Add a baby duck">🐥<span class="plus">+</span></button>
    <button class="btn sep" id="look" title="Change my look" aria-label="Change my look">👕</button>
    <button class="btn" id="view" title="Switch camera (F)" aria-label="Switch camera">👁</button>
    <button class="btn" id="sound" title="Sound on or off" aria-label="Sound on or off">🔊</button>
    <button class="btn" id="home" title="Go home" aria-label="Go home">🏠</button>
    <button class="btn" id="reset" title="Start a new world" aria-label="Start a new world">↺</button>
  </div>
</div>

<div id="label"></div>
<div id="hotbar" role="toolbar" aria-label="Blocks"></div>
<div id="hint"><b>WASD</b> walk · <b>Space</b> jump<br><b>Drag</b> to look around<br><b>Click</b> to dig, build or pet<br><b>1–9</b> pick a block · <b>F</b> camera</div>
<div id="stick" aria-hidden="true"><div id="knob"></div></div>
<button id="jump" aria-label="Jump">JUMP</button>

<div id="start">
  <form class="card" id="start-form">
    <h1>Alyson's World</h1>
    <label for="name-in">What's your name?</label>
    <div class="row">
      <input id="name-in" maxlength="18" autocomplete="off" spellcheck="false">
      <button type="button" class="btn" id="dice" title="Pick a funny name" aria-label="Pick a funny name">🎲</button>
    </div>
    <span class="lbl">Pick your outfit</span>
    <div class="row" id="looks"></div>
    <button type="submit" class="play" id="play">PLAY</button>
  </form>
</div>

<div id="errbox" hidden></div>
<script>
// Shows any error on screen so it can be reported, and makes PLAY always close the start screen
(function () {
  var box = document.getElementById('errbox');
  function show(msg) {
    box.hidden = false;
    box.textContent = (box.textContent ? box.textContent + '\n' : 'Something went wrong. Tell Claude this:\n') + msg;
  }
  window.addEventListener('error', function (e) {
    show((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && e.reason.message || e.reason)); });
  document.getElementById('start-form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('start').hidden = true;
  });
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
if (!window.THREE) {
  document.body.insertAdjacentHTML('beforeend', '<div id="oops">The world could not load. Check the internet connection and reload.</div>');
  return;
}

// ---------- World data ----------
const W = 128, D = 128, H = 72, WATER_LVL = 33;
const AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, LOG = 4, LEAVES = 5, PLANKS = 6, SAND = 7, WATER = 8, COBBLE = 9, GLASS = 10, WOOL = 11, BRICK = 12, GOLD = 13, DIAMOND = 14;
const NAMES = { [GRASS]: 'Grass', [DIRT]: 'Dirt', [STONE]: 'Stone', [LOG]: 'Wood', [LEAVES]: 'Leaves', [PLANKS]: 'Planks', [SAND]: 'Sand', [COBBLE]: 'Cobblestone', [GLASS]: 'Glass', [WOOL]: 'Pink wool', [BRICK]: 'Bricks', [GOLD]: 'Gold ore', [DIAMOND]: 'Diamond ore' };
const world = new Uint8Array(W * H * D);
const idx = (x, y, z) => x + z * W + y * W * D;
const inB = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < W && y < H && z < D;
const get = (x, y, z) => inB(x, y, z) ? world[idx(x, y, z)] : AIR;
const blockAt = (x, y, z) => get(Math.floor(x), Math.floor(y), Math.floor(z));
function solid(x, y, z) {
  if (x < 0 || z < 0 || x >= W || z >= D || y < 0) return true;
  if (y >= H) return false;
  const t = world[idx(x, y, z)];
  return t !== AIR && t !== WATER;
}

const SEED = 1234;
function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(ix, iz, s) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(s, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z, s) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), w = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz, s), b = hash2(ix + 1, iz, s), c = hash2(ix, iz + 1, s), d = hash2(ix + 1, iz + 1, s);
  return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
}

const POND = { x: 92, z: 88 };
const SPAWN = { x: 60, z: 52 };
function topY(x, z) { for (let y = H - 1; y >= 0; y--) if (solid(x, y, z)) return y + 1; return 1; }

// Rolling hills about 35 blocks deep, with gold below y 26 and diamonds near the bottom
function generate() {
  world.fill(AIR);
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    let h = 30 + vnoise(x / 40, z / 40, 3) * 12 + vnoise(x / 16, z / 16, 1) * 6 + vnoise(x / 6, z / 6, 2) * 2;
    const pd = Math.hypot(x - POND.x, z - POND.z);
    if (pd < 11) h = Math.min(h, WATER_LVL + 1) - (11 - pd) * 0.8;
    const sd = Math.hypot(x - SPAWN.x, z - SPAWN.z);
    if (sd < 8) h = h + (38 - h) * (1 - sd / 8) * 0.85;
    h = Math.max(4, Math.min(H - 14, Math.round(h)));
    const beach = h <= WATER_LVL + 1;
    const dirtDepth = 3 + (hash2(x, z, 7) < 0.5 ? 1 : 0);
    for (let y = 0; y < h; y++) {
      let t = STONE;
      if (y === h - 1) t = beach ? SAND : GRASS;
      else if (y >= h - dirtDepth) t = beach && y >= h - 3 ? SAND : DIRT;
      else if (y > 0) {
        const r = hash2(x + y * 1031, z, 9);
        if (y < 14 && r < 0.006) t = DIAMOND;
        else if (y < 26 && r > 0.988) t = GOLD;
      }
      world[idx(x, y, z)] = t;
    }
    for (let y = h; y < WATER_LVL; y++) world[idx(x, y, z)] = WATER;
  }
  const R = rng(SEED), trees = [];
  for (let n = 0; n < 3000 && trees.length < 64; n++) {
    const x = 3 + Math.floor(R() * (W - 6)), z = 3 + Math.floor(R() * (D - 6));
    const ty = topY(x, z);
    if (get(x, ty - 1, z) !== GRASS) continue;
    if (Math.hypot(x - SPAWN.x, z - SPAWN.z) < 8 || Math.hypot(x - POND.x, z - POND.z) < 14) continue;
    if (trees.some(t => Math.hypot(t[0] - x, t[1] - z) < 5)) continue;
    trees.push([x, z]);
    const th = 4 + Math.floor(R() * 2);
    for (let dy = -2; dy <= 1; dy++) {
      const r = dy < 0 ? 2 : 1, ly = ty + th + dy;
      for (let dx = -r; dx <= r; dx++) for (let dz = -r; dz <= r; dz++) {
        if (Math.abs(dx) === r && Math.abs(dz) === r && (dy === 1 || R() < 0.5)) continue;
        if (inB(x + dx, ly, z + dz) && get(x + dx, ly, z + dz) === AIR) world[idx(x + dx, ly, z + dz)] = LEAVES;
      }
    }
    for (let y = ty; y < ty + th; y++) world[idx(x, y, z)] = LOG;
  }
}
// The untouched world is generated once and copied back whenever it is needed again
let BASE = null;
function baseWorld() { if (BASE) world.set(BASE); else { generate(); BASE = world.slice(); } }

// ---------- Saving ----------
const KEY = 'alysons-world-v2';
let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
const edits = new Map();
function setBlock(x, y, z, t) { const i = idx(x, y, z); world[i] = t; edits.set(i, t); markDirty(x, z); }

// ---------- Three.js setup ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const SKY = 0x8ecff5;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 40, 110);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x7f8c70, 0.8));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.5); sunLight.position.set(0.4, 1, 0.3); scene.add(sunLight);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- Pixel textures ----------
const atlas = document.createElement('canvas'); atlas.width = atlas.height = 64;
const actx = atlas.getContext('2d');
const TR = rng(7);
const jit = (a = 0.88, b = 1.1) => a + TR() * (b - a);
const v = (c, f, a = 1) => [c[0] * f, c[1] * f, c[2] * f, a];
function paint(tile, fn) {
  const ox = (tile % 4) * 16, oy = Math.floor(tile / 4) * 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const c = fn(x, y);
    actx.fillStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${c[3]})`;
    actx.fillRect(ox + x, oy + y, 1, 1);
  }
}
const GR = [106, 172, 62], DI = [134, 96, 67], BARK = [110, 84, 50];
const gd = Array.from({ length: 16 }, () => 3 + Math.floor(TR() * 2.5));
paint(0, () => v(GR, jit()));
paint(1, (x, y) => y < gd[x] ? v(GR, jit()) : v(DI, jit()));
paint(2, () => v(DI, jit(0.82, 1.12)));
paint(3, () => v([128, 128, 130], TR() < 0.12 ? 0.72 : jit()));
paint(4, (x) => v(BARK, (x % 4 === 0 ? 0.72 : 1) * jit(0.9, 1.08)));
paint(5, (x, y) => { const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)); return d > 6.5 ? v(BARK, jit()) : v([176, 142, 88], (Math.floor(d) % 2 ? 0.85 : 1) * jit(0.95, 1.05)); });
paint(6, () => TR() < 0.18 ? v([40, 96, 28], 1) : v([62, 138, 44], jit(0.8, 1.15)));
paint(7, (x, y) => { const row = y >> 2, seam = (x + row * 5) % 16 === 0; return v([182, 144, 90], (y % 4 === 3 || seam) ? 0.68 : jit(0.92, 1.06)); });
paint(8, () => v([222, 210, 156], jit(0.92, 1.05)));
paint(9, () => v([56, 118, 222], jit(0.9, 1.1), 0.72));
paint(10, (x, y) => v([124, 124, 126], ((x + (y >> 2) * 3) % 5 === 0 || y % 4 === 0) ? 0.62 : jit(0.85, 1.12)));
paint(11, (x, y) => (x === 0 || y === 0 || x === 15 || y === 15) ? [235, 245, 255, 0.95] : ((x === y + 3 && x < 9) || (x === y + 5 && x < 10)) ? [255, 255, 255, 0.7] : [190, 225, 255, 0.16]);
paint(12, () => v([242, 150, 192], jit(0.9, 1.06)));
paint(13, (x, y) => { const off = (y >> 2) % 2 ? 4 : 0; return (y % 4 === 3 || (x + off) % 8 === 0) ? v([205, 195, 182], jit(0.95, 1.03)) : v([156, 72, 56], jit(0.88, 1.1)); });
const speck = (x, y, s) => hash2(x >> 1, y >> 1, s) < 0.22;
paint(14, (x, y) => speck(x, y, 14) ? v([246, 206, 64], jit(0.9, 1.1)) : v([128, 128, 130], jit()));
paint(15, (x, y) => speck(x, y, 15) ? v([92, 232, 228], jit(0.9, 1.1)) : v([128, 128, 130], jit()));
const tex = new THREE.CanvasTexture(atlas);
tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;

// [top, bottom, side] tile for each block
const FT = { [GRASS]: [0, 2, 1], [DIRT]: [2, 2, 2], [STONE]: [3, 3, 3], [LOG]: [5, 5, 4], [LEAVES]: [6, 6, 6], [PLANKS]: [7, 7, 7], [SAND]: [8, 8, 8], [WATER]: [9, 9, 9], [COBBLE]: [10, 10, 10], [GLASS]: [11, 11, 11], [WOOL]: [12, 12, 12], [BRICK]: [13, 13, 13], [GOLD]: [14, 14, 14], [DIAMOND]: [15, 15, 15] };
const CRUMB = { [GRASS]: '#6aac3e', [DIRT]: '#866043', [STONE]: '#808082', [LOG]: '#6e5432', [LEAVES]: '#3e8a2c', [PLANKS]: '#b6905a', [SAND]: '#ded29c', [COBBLE]: '#787878', [GLASS]: '#cfe8ff', [WOOL]: '#f296c0', [BRICK]: '#9c4838', [GOLD]: '#f6ce40', [DIAMOND]: '#5ce8e4' };

function updatePlayer(dt) {
  const k = (c) => keys.has(c) ? 1 : 0;
  const fwd = k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') - joy.y;
  const str = k('KeyD') + k('ArrowRight') - k('KeyA') - k('ArrowLeft') + joy.x;

function resetMobs() { while (mobs.length) mobs[0].remove(); defaultMobs(); }

// ---------- Playing together ----------
// room: see friends live and share moments
const net = { room: null, peer: null, amHost: true, since: Date.now(), gotMobs: false };
function netEmit(topic, data) { if (net.room && remotes.size) net.room.emit(topic, data).catch(() => {}); }

}
const serializeMobs = () => mobs.map(m => [m.id, KINDS.indexOf(m.kind), VARS.indexOf(m.variant), Math.round(m.pos.x * 10), Math.round(m.pos.y * 10), Math.round(m.pos.z * 10), Math.round(m.yaw * 100)]);
function readMobList(list, snap) {
  if (!Array.isArray(list)) return;
  const seen = new Set();
  for (const e of list.slice(0, 80)) {
    if (!Array.isArray(e) || e.length < 7 || !e.every(Number.isFinite)) continue;
    const [id, k, v, x, y, z, yw] = e;
    if (!KINDS[k] || v < 0 || v >= VARS.length || id < 1) continue;
    let m = mobById.get(id);
    if (m && (m.kind !== KINDS[k] || m.variant !== VARS[v])) { m.remove(); m = null; }
    if (!m) { m = new Mob(KINDS[k], VARS[v], x / 10, y / 10, z / 10, id); m.yaw = yw / 100; }
    m.tgt.set(x / 10, y / 10, z / 10); m.tyaw = yw / 100;
    if (snap) { m.pos.copy(m.tgt); m.vel.set(0, 0, 0); }

}
function nameTex(name) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 64; const x = c.getContext('2d');
  x.font = '700 30px Silkscreen, ui-monospace, monospace';
  const w = Math.min(310, x.measureText(name).width + 28);

}
function setTag(r, name) {
  if (r.tagName === name) return;
  r.tagName = name; r.tag.material.map.dispose(); r.tag.material.map = nameTex(name); r.tag.material.needsUpdate = true;
}
function upsertRemote(p) {
  if (p.sameTab || p.kind !== 'viewer') return;
  const pr = p.presence || {}, a = pr.p;
  if (!Array.isArray(a) || a.length !== 3 || !a.every(Number.isFinite)) return;
  const look = typeof pr.l === 'string' && PLAYER_LOOKS.includes(pr.l) ? pr.l : 'coral';
  let r = remotes.get(p.peer);

    r = { pos: new THREE.Vector3(a[0], a[1], a[2]), vel: new THREE.Vector3(), tgt: new THREE.Vector3(), yaw: 0, targetYaw: 0, phase: 0, petT: 0, hw: 0.3, h: 1.8, look: null, model: null };
    r.tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: nameTex('Friend'), transparent: true, depthWrite: false }));
    r.tag.scale.set(2, 0.4, 1); r.tag.position.y = 2.25;

function dropRemote(peer) {

  remotes.delete(peer);
}
function updateRemotes(dt) {
  for (const r of remotes.values()) {
    const ox = r.pos.x, oy = r.pos.y, oz = r.pos.z;
    if (r.pos.distanceTo(r.tgt) > 6) r.pos.copy(r.tgt); else r.pos.lerp(r.tgt, Math.min(1, dt * 10));
    r.vel.set((r.pos.x - ox) / dt, (r.pos.y - oy) / dt, (r.pos.z - oz) / dt);

}
// The animal keeper is whoever has been here longest and can share; everyone else follows them
function electHost() {
  if (!net.room) { net.amHost = true; return; }
  const cands = net.room.peers().filter(p => p.kind === 'viewer' && p.presence && p.presence.w === 1 && Number.isFinite(p.presence.since));
  const me = net.room.peers().find(p => p.sameTab);
  cands.sort((a, b) => a.presence.since - b.presence.since || (a.peer < b.peer ? -1 : 1));
  const was = net.amHost;
  net.amHost = !cands.length || (me && cands[0].peer === me.peer) || false;

}
const sub = document.getElementById('sub');
function updateWho() {
  const n = remotes.size;
  sub.textContent = n ? `${myName} · ${n + 1} playing together` : `${myName} · dig, build & pet`;
}
async function initNet() {
  // Players connect directly to each other
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js');
    const room = makePeerRoom();
    if (room) {
      // Only the host (whose world everyone shares) may start a new world; playing offline counts as host
      net.peer = room;
      const showReset = () => { resetBtn.hidden = room.role() === 'guest'; };
      showReset(); setInterval(showReset, 1000);

}
function wireRoom(room) {
  {
    net.room = room;
    room.presence({ since: net.since, w: 1,n: myName }).catch(() => {});
    room.onPeers((ch) => {
      for (const p of ch.joined) upsertRemote(p);
      for (const p of ch.updated) upsertRemote(p);
      for (const p of ch.left) dropRemote(p.peer);
      electHost(); updateWho();
    }, () => { for (const k of [...remotes.keys()]) dropRemote(k); net.amHost = true; updateWho(); });
    room.on('block', (m) => {
      if (m.sameTab || !m.data) return;
      const { i, t } = m.data;
      if (!Number.isInteger(i) || i < 0 || i >= world.length || (t !== AIR && FT[t] === undefined)) return;
      world[i] = t; edits.set(i, t);      const x = i % W, z = Math.floor(i / W) % D, y = Math.floor(i / (W * D));
      markDirty(x, z);
      if (t === AIR && player.pos.distanceTo(new THREE.Vector3(x, y, z)) < 12) SOUNDS.dig();
    });

}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}

// Direct connections (PeerJS) between players. Everyone opening the page tries to
// claim one well-known hub id; whoever gets it relays for the rest, and if the hub leaves the
// others race to take over. The hub also hands newcomers the world's blocks.
const HUB_ID = 'alysons-world-eljws-hub-v2';
function makePeerRoom() {
  if (typeof window.Peer !== 'function') return null;
  const listeners = {}, peerFns = [], conns = new Map(), pres = new Map(), seen = new Map();
  let me = null, hub = false, peer = null, hubConn = null, myPres = {}, lastHub = 0, retryT = 0;
  const entry = (id) => ({ peer: id, by: null, isMe: id === me, sameTab: id === me, kind: 'viewer', guest: false, presence: pres.get(id) || {}, updatedAt: Date.now() });
  const notify = (joined, left, updated) => {
    const ch = { peers: [...pres.keys()].map(entry), joined: joined.map(entry), left: left.map(id => ({ peer: id })), updated: updated.map(entry) };
    peerFns.forEach(f => { try { f(ch); } catch (e) { /* keep going */ } });
  };
  const setPres = (id, p) => {
    if (!id || id === me || !p || typeof p !== 'object') return;
    const had = pres.has(id); pres.set(id, p);
    notify(had ? [] : [id], [], had ? [id] : []);
  };
  const deliver = (topic, data, from) => {
    if (typeof topic !== 'string') return;
    (listeners[topic] || []).forEach(f => { try { f({ topic, data, peer: from, by: null, isMe: false, sameTab: from === me, kind: 'viewer', guest: false }); } catch (e) { /* ignore */ } });
  };
  const send = (c, m) => { try { if (c && c.open) c.send(m); } catch (e) { /* dropped */ } };
  const broadcast = (m, except) => { for (const [id, c] of conns) if (id !== except) send(c, m); };
  function dropConn(id) {
    if (!conns.has(id)) return;
    conns.delete(id); seen.delete(id);
    if (pres.delete(id)) notify([], [id], []);
    broadcast({ k: 'left', id });
  }
  function onHubData(id, m) {
    if (!m || typeof m !== 'object') return;
    seen.set(id, Date.now());
    if (m.k === 'ev') { deliver(m.topic, m.data, id); broadcast({ k: 'ev', topic: m.topic, data: m.data, from: id }, id); }
    else if (m.k === 'pr') { setPres(id, m.p); broadcast({ k: 'pr', from: id, p: m.p }, id); }
  }
  function onClientData(m) {
    if (!m || typeof m !== 'object') return;
    lastHub = Date.now();
    if (m.k === 'ev') deliver(m.topic, m.data, m.from);
    else if (m.k === 'pr') setPres(m.from, m.p);
    else if (m.k === 'left') { if (pres.delete(m.id)) notify([], [m.id], []); }
    else if (m.k === 'all' && Array.isArray(m.list)) for (const [id, p] of m.list) setPres(id, p);
    else if (m.k === 'world' && Array.isArray(m.e)) {
      edits.clear();
      for (const e of m.e) if (Array.isArray(e) && Number.isInteger(e[0]) && e[0] >= 0 && e[0] < world.length && (e[1] === AIR || FT[e[1]] !== undefined)) edits.set(e[0], e[1]);
      baseWorld(); for (const [i, t] of edits) world[i] = t; dirty = true; save();
    }
  }
  function reset() {
    hub = false; hubConn = null;
    for (const c of conns.values()) { try { c.close(); } catch (e) { /* closed */ } }
    conns.clear(); seen.clear();
    const gone = [...pres.keys()].filter(id => id !== me);
    pres.clear();
    if (gone.length) notify([], gone, []);
    try { if (peer) peer.destroy(); } catch (e) { /* gone */ }
    peer = null; me = null;
  }
  function retry() { reset(); clearTimeout(retryT); retryT = setTimeout(start, 1500 + Math.random() * 2500); }
  function start() {
    peer = new window.Peer(HUB_ID, { debug: 0 });
    peer.on('open', (id) => { me = id; hub = true; pres.set(me, myPres); });
    peer.on('connection', (c) => {
      c.on('open', () => {
        conns.set(c.peer, c); seen.set(c.peer, Date.now());
        send(c, { k: 'all', list: [...pres].filter(([id]) => id !== c.peer) });
        send(c, { k: 'world', e: [...edits] });
      });
      c.on('data', (m) => onHubData(c.peer, m));
      c.on('close', () => dropConn(c.peer));
      c.on('error', () => dropConn(c.peer));
    });

    });

  }
  function joinHub() {
    const p = peer = new window.Peer({ debug: 0 });
    p.on('open', (id) => {
      me = id; pres.set(me, myPres);
      const c = hubConn = p.connect(HUB_ID, { reliable: true });
      c.on('open', () => { lastHub = Date.now(); send(c, { k: 'pr', p: myPres }); });
      c.on('data', onClientData);

    }

  start();
  return {
    emit(topic, data) {
      if (hub) broadcast({ k: 'ev', topic, data, from: me });
      else send(hubConn, { k: 'ev', topic, data });
      return Promise.resolve();
    },
    presence(patch) {
      myPres = Object.assign({}, myPres, patch);
      if (me) pres.set(me, myPres);
      if (hub) broadcast({ k: 'pr', from: me, p: myPres });
      else send(hubConn, { k: 'pr', p: myPres });
      return Promise.resolve();
    },
    peers() { return [...pres.keys()].map(entry); },
    role() { return hub ? 'host' : me ? 'guest' : 'offline'; },
    on(topic, fn) { (listeners[topic] || (listeners[topic] = [])).push(fn); return () => {}; },
    onPeers(fn) { peerFns.push(fn); return () => {}; },
  };
}
// ---------- Start screen: name and outfit ----------
const startEl = document.getElementById('start'), nameIn = document.getElementById('name-in'), looksEl = document.getElementById('looks');

initNet();

// ---------- Main loop ----------
let last = performance.now(), tAll = 0, netT = 0, mobT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tAll += dt;
  if (dirty || dirtyChunks.size) buildWorld();

  updateRemotes(dt);
  if (net.amHost) {

  } else for (const m of mobs) m.follow(dt);

    if (netT > 0.07) {
      netT = 0;
      net.room.presence({ p: [+player.pos.x.toFixed(2), +player.pos.y.toFixed(2), +player.pos.z.toFixed(2)], r: +player.yaw.toFixed(2), l: playerLook }).catch(() => {});
    }

  }
  updateFx(dt);
  for (const c of clouds) { c.position.x += dt * 0.6; if (c.position.x > W + 40) c.position.x = -40; }

  requestAnimationFrame(frame);
}

})();
